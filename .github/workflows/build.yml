name: CI Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APKS: universal arm64-v8a armeabi-v7a x86 x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      # Optional release signing, same secret contract as mpvRx:
      # SIGNING_KEYSTORE (base64), SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD,
      # KEY_PASSWORD. Gradle signs the per-ABI release APKs directly when they
      # are present; without them the build falls back to debug signing
      # (see keystore.properties handling in app/build.gradle.kts), so fork
      # PRs stay green with installable artifacts.
      - name: Configure release signing (if secrets present)
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "No signing secrets; release will use the debug fallback."
            exit 0
          fi
          if [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE is set but alias/password secrets are missing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          trap 'rm -f release.keystore keystore.properties' EXIT

      # Release builds only (like mpvRx: no debug APKs in CI).
      - name: Build per-ABI release APKs
        run: ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Verify APK signatures
        run: |
          for abi in $APKS; do
            f="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [ ! -f "$f" ]; then
              echo "::error::Missing expected APK: $f"
              exit 1
            fi
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$f"
          done

      - name: Upload universal release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-universal-release-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-universal-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload arm64-v8a release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-arm64-v8a-release-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload armeabi-v7a release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-armeabi-v7a-release-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload x86 release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-x86-release-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-x86-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-x86_64-release-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
