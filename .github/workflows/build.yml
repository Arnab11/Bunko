name: CI Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Optional release signing, same secret contract as a stock mpvRx setup:
      # SIGNING_KEYSTORE (base64), SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD,
      # KEY_PASSWORD. Without them the Gradle build falls back to debug signing
      # (see keystore.properties handling in app/build.gradle.kts), so fork PRs
      # stay green.
      - name: Configure release signing (if secrets present)
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "No signing secrets; release will use the debug fallback."
            exit 0
          fi
          if [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::SIGNING_KEYSTORE is set but alias/password secrets are missing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          trap 'rm -f release.keystore' EXIT
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          trap 'rm -f release.keystore keystore.properties' EXIT

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunko-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
