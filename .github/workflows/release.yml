name: Make release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (e.g. v0.24)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-for-github:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION_TAG="$INPUT_TAG"
          else
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$VERSION_TAG" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            echo "::error::Tag must look like v0.24 or v0.24-preview.1 (got: $VERSION_TAG)."
            exit 1
          fi
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          if echo "$VERSION_TAG" | grep -Eq '\-preview\.[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Release signing is mandatory here (unlike CI builds): all four secrets
      # must be present, mirroring the mpvRx release contract.
      - name: Configure release signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing requires SIGNING_KEYSTORE, SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD and KEY_PASSWORD secrets."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --max-workers=2

      - name: Stage release assets
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/Bunko-${VERSION_TAG}.apk"
          rm -f release.keystore keystore.properties
          (cd release-assets && sha256sum ./*.apk > checksums.txt)
          cat release-assets/checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bunko ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            release-assets/Bunko-*.apk
            release-assets/checksums.txt
