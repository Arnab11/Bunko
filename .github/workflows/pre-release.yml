name: Make Pre Release

# Hand-cut beta channel: pushing a v0.24-preview.1 tag publishes the preview
# build type as a GitHub prerelease. (The scheduled preview.yml covers the
# automatic per-commit previews.)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+-preview.[0-9]+"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Preview tag to release (e.g. v0.24-preview.1)"
        required: true
        type: string

permissions:
  contents: write

env:
  APKS: universal arm64-v8a armeabi-v7a x86 x86_64

jobs:
  pre-release-for-github:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION_TAG="$INPUT_TAG"
          else
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$VERSION_TAG" | grep -Eq '^v[0-9]+\.[0-9]+-preview\.[0-9]+$'; then
            echo "::error::Tag must look like v0.24-preview.1 (got: $VERSION_TAG)."
            exit 1
          fi
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure preview signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Preview signing requires SIGNING_KEYSTORE, SIGNING_KEY_ALIAS, SIGNING_STORE_PASSWORD and KEY_PASSWORD secrets."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build preview APKs
        run: ./gradlew assemblePreview --stacktrace --no-daemon --max-workers=2

      - name: Sign and verify preview APKs
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          printf '%s' "${{ secrets.SIGNING_KEYSTORE }}" | base64 --decode > release.keystore
          for abi in $APKS; do
            unsigned="app/build/outputs/apk/preview/app-${abi}-preview-unsigned.apk"
            signed="app/build/outputs/apk/preview/app-${abi}-preview.apk"
            if [[ ! -f "$unsigned" ]]; then
              echo "::error::Missing expected APK: $unsigned"
              exit 1
            fi
            "$apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$unsigned"
            "$apksigner" verify --verbose "$signed"
            rm -f "$unsigned"
          done

      - name: Stage pre-release assets
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p preview
          for abi in $APKS; do
            cp "app/build/outputs/apk/preview/app-${abi}-preview.apk" "preview/Bunko-preview-${abi}-${VERSION_TAG}.apk"
          done
          rm -f release.keystore keystore.properties
          (cd preview && sha256sum ./*.apk > checksums.txt)
          cat preview/checksums.txt

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Bunko ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            preview/Bunko-*.apk
            preview/checksums.txt
